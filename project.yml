name: TableSurf
options:
  bundleIdPrefix: dev.tablesurf
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  PostgresNIO:
    url: https://github.com/vapor/postgres-nio
    from: 1.25.0
  MySQLNIO:
    path: ThirdParty/mysql-nio
  NIOSSL:
    url: https://github.com/apple/swift-nio-ssl
    from: 2.25.0
targets:
  TableSurfCore:
    type: framework
    platform: macOS
    sources:
      - Sources/TableSurfCore
    dependencies:
      - package: PostgresNIO
      - package: MySQLNIO
      - package: NIOSSL
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
  TableSurf:
    type: application
    platform: macOS
    sources:
      - path: Sources/TableSurfApp
        excludes: [Resources/ssh-askpass]
      # Sem extensão, o XcodeGen não o reconhece como recurso sozinho.
      - path: Sources/TableSurfApp/Resources/ssh-askpass
        buildPhase: resources
      # Ícone (Icon Composer) compartilhado com o iOS.
      - path: Sources/Shared/AppIcon.icon
        buildPhase: resources
    dependencies:
      - target: TableSurfCore
    settings:
      base:
        PRODUCT_NAME: TableSurf
        # O mesmo bundle do iOS: um registro só na App Store (compra universal).
        PRODUCT_BUNDLE_IDENTIFIER: dev.tablesurf.app
        MARKETING_VERSION: "0.2.5"
        CURRENT_PROJECT_VERSION: "8"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        # Direct (DMG, install.sh) roda sem sandbox; o app-store.sh passa AppStore, que
        # liga o sandbox exigido pela Mac App Store.
        TABLESURF_DISTRIBUTION: Direct
        CODE_SIGN_ENTITLEMENTS: Config/TableSurf-$(TABLESURF_DISTRIBUTION).entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: TableSurf
        COMBINE_HIDPI_IMAGES: YES

  # MARK: iOS
  # O core é o mesmo código; o target separado existe porque o framework macOS é
  # assinado ad-hoc e embutido pelo install.sh — misturar plataformas num target só
  # renomearia os produtos de que o script depende.
  TableSurfCoreiOS:
    type: framework
    platform: iOS
    sources:
      - Sources/TableSurfCore
    dependencies:
      - package: PostgresNIO
      - package: MySQLNIO
      - package: NIOSSL
    settings:
      base:
        PRODUCT_NAME: TableSurfCore
        PRODUCT_BUNDLE_IDENTIFIER: dev.tablesurf.core
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  TableSurfMobile:
    type: application
    platform: iOS
    sources:
      - Sources/TableSurfMobile
      - path: Sources/Shared/AppIcon.icon
        buildPhase: resources
      # Estado e preferências são os mesmos do Mac: uma regra de conexão/túnel/abas só.
      - Sources/TableSurfApp/AppState.swift
      - Sources/TableSurfApp/ConnectionSession.swift
      - Sources/TableSurfApp/AppSettings.swift
      - Sources/TableSurfApp/Theme.swift
      - Sources/TableSurfApp/Views/Editor/SQLSyntaxHighlighter.swift
    dependencies:
      - target: TableSurfCoreiOS
    settings:
      base:
        PRODUCT_NAME: TableSurf
        PRODUCT_BUNDLE_IDENTIFIER: dev.tablesurf.app
        MARKETING_VERSION: "0.2.5"
        CURRENT_PROJECT_VERSION: "8"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: TableSurf
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "O TableSurf acessa servidores de banco de dados na sua rede local."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  TableSurfMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/TableSurfMobileUITests
    dependencies:
      - target: TableSurfMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tablesurf.app.uitests
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TableSurfMobile
schemes:
  TableSurfMobile:
    build:
      targets:
        TableSurfMobile: all
    test:
      targets:
        - TableSurfMobileUITests
